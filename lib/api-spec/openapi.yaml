openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /plantel:
    get:
      operationId: getPlantel
      tags: [plantel]
      summary: Last validated River Plate professional roster
      responses:
        "200":
          description: Roster persisted from the official River Plate source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plantel"
        "503":
          description: No validated roster has been stored yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantelUnavailable"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    JugadorPlantel:
      type: object
      additionalProperties: false
      required: [numero, nombre, apellido, posicion, nacionalidad, foto]
      properties:
        numero:
          type: [integer, "null"]
        nombre:
          type: string
        apellido:
          type: string
        posicion:
          type: string
          enum: [ARQ, DEF, MED, DEL]
        nacionalidad:
          type: string
        foto:
          type: string
          format: uri
    Plantel:
      type: object
      additionalProperties: false
      required: [jugadores, actualizadoEn, fuente]
      properties:
        jugadores:
          type: array
          items:
            $ref: "#/components/schemas/JugadorPlantel"
        actualizadoEn:
          type: string
          format: date-time
        fuente:
          type: string
          format: uri
    PlantelUnavailable:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

